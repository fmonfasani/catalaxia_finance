version: "3.9"

services:
  db:
    image: postgres:16
    container_name: catalaxia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalaxia
      POSTGRES_USER: catalaxia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalaxia -d catalaxia"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    image: catalaxia-pipeline
    container_name: catalaxia-pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: catalaxia
      DB_USER: catalaxia
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./data:/app/data
    working_dir: /app
    profiles:
      - manual

  migrate:
    build: .
    image: catalaxia-pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: catalaxia
      DB_USER: catalaxia
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./data:/app/data
    working_dir: /app
    entrypoint: ["python", "scripts/tickets/screener/migrate_sqlite_to_pg.py"]
    profiles:
      - manual

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: catalaxia-api
    container_name: catalaxia-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: catalaxia
      DB_USER: catalaxia
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./api:/app/api
    working_dir: /app

  nginx:
    image: nginx:latest
    container_name: catalaxia-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:9200:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    command: nginx -g 'daemon off;'

# Pipeline ENGINE certificado (S00→C12). No es un servicio permanente:
  # se ejecuta por corrida y sale.
  #   docker compose --profile run-e2e run --rm engine                  # FAST
  #   docker compose --profile run-e2e run --rm engine --mode FULL
  # Ver docs/DEPLOY_HETZNER.md · engine.
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: catalaxia-engine
    profiles: ["run-e2e"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENGINE_DB_HOST: db
      ENGINE_DB_PORT: "5432"
      ENGINE_DB_NAME: catalaxia
      # F-025: la aplicacion NO corre como superusuario (migracion 011).
      ENGINE_DB_USER: catalaxia_engine
      ENGINE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Via administrativa SOLO para migraciones y bootstrap del rol.
      ENGINE_ADMIN_DB_USER: catalaxia
      ENGINE_ADMIN_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # EXT-010: `catalaxia_engine` en puerto 5432 dentro de compose ES el
      # destino productivo declarado, no un accidente: se habilita explicito.
      ENGINE_ALLOW_PROD: "1"
      ENGINE_MODE: ${ENGINE_MODE:-FAST}
      ENGINE_STATEMENT_TIMEOUT_MS: ${ENGINE_STATEMENT_TIMEOUT_MS:-300000}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      # Cache RAW de SEC (data/raw/engine) + sqlite legado (screener.db,
      # solo lectura) + outputs de c10/c11/reports.
      - ./data:/app/data
      - ./outputs:/app/outputs

volumes:
  pgdata:
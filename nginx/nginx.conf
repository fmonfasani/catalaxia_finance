user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    upstream api_backend {
        server api:8100;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # Resolver para Docker DNS
        resolver 127.0.0.11:53 valid=10s;
        resolver_timeout 5s;

        # Health check
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # API proxy (toma prioridad ABSOLUTA)
        location /v2/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Screener - Ruta exacta (ANTES del fallback)
        location = /screener {
            try_files /screener_final.html =404;
        }

        # Dashboard (home)
        location = / {
            try_files /dashboard_final_v2.html =404;
        }

        # Archivos estáticos existentes
        location ~* \.(html|css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Fallback: servir HTML para rutas no encontradas
        location / {
            try_files $uri /dashboard_final_v2.html;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}

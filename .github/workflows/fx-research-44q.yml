name: FX Research 44Q

on:
  push:
    branches: [research/fx-44q]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fx-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytest
      - name: Run FX 44Q research
        run: python scripts/fx_research/run_fx_44q.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fx-research-44q-results
          path: artifacts/fx_44q/

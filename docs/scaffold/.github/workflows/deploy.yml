name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all | api | screener | catalaxia)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ─── 1. Tests ────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r apps/api/requirements.txt

      - name: Run tests
        run: |
          cd apps/api
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test_secret

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        run: pnpm turbo lint typecheck --filter=screener --filter=catalaxia

  # ─── 2. Build & Push images ─────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api, screener, catalaxia]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            DOCKER_BUILD=1

  # ─── 3. Deploy a Hetzner ─────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [build]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/catalaxia

            # Actualizar el compose file desde el repo
            git pull origin main

            # Escribir .env con los secrets
            cat > .env << 'ENVEOF'
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            API_SECRET_KEY=${{ secrets.API_SECRET_KEY }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            GHCR_IMAGE=${{ github.repository }}
            IMAGE_TAG=${{ github.sha }}
            API_URL=https://api.catalaxia.webshooks.com
            SCREENER_URL=https://screener.catalaxia.com
            CATALAXIA_URL=https://catalaxia.webshooks.com
            ENVEOF

            # Login al registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull nuevas imágenes
            docker compose pull

            # Restart con zero-downtime (uno por uno)
            docker compose up -d --no-deps api
            sleep 15
            docker compose up -d --no-deps screener
            docker compose up -d --no-deps catalaxia

            # Health check
            sleep 10
            curl -f http://localhost:8100/health || (echo "API health check failed" && exit 1)

            # Limpiar imágenes viejas
            docker image prune -f

            echo "✅ Deploy ${{ github.sha }} exitoso"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy falló para commit ${{ github.sha }}"
          # Agregar webhook de Slack/Discord acá si se quiere

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0"
description = "Generador modular de documentación técnica a DOCX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1.0",
  "python-pptx>=1.0.2",
  "markdown-it-py>=3.0.0",
  "lxml>=5.3.0",
  "Pillow>=10.4.0",
  "Pygments>=2.18.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# Reverse proxy del HOST (el mismo nginx que ya sirve wapsell en la VPS Hetzner).
# Copiar a: /etc/nginx/sites-available/api.catalaxia.conf  y  ln -s a sites-enabled/
# Luego: sudo certbot --nginx -d api.catalaxia.<dominio>   (TLS gratis)
#
# La API corre en Docker y escucha en 127.0.0.1:8100 (ver docker-compose.yml).
# Este vhost la publica en el subdominio. No toca la config de wapsell.

server {
    server_name api.catalaxia.<dominio>;

    location / {
        proxy_pass         http://127.0.0.1:8100;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # (certbot agrega acá el bloque listen 443 ssl + certificados)
    listen 80;
}


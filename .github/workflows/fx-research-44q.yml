name: FX Research 44Q

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fx-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas requests

      - name: Verify repository and FX collectors
        run: |
          python --version
          test -f scripts/dolares/fetch_dolarito_historico.py

      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo 'No tests directory present'; fi

      - name: Publish execution metadata
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit_sha.txt
          printf 'research_branch=%s\n' '${{ github.ref_name }}' > artifacts/run_context.txt
          printf 'objective=44 quarters; A3500, OFICIAL, MEP, CCL\n' >> artifacts/run_context.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fx-research-44q-metadata
          path: artifacts/
